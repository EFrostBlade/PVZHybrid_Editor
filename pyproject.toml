[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = [
  "editor_config.py",
  "i18n.py",
  "editor_runtime.py",
  "release_package.py",
  "responsive_tk.py",
]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
strict = true
